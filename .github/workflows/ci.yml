name: unit-tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          python-version: '3.12'
      # Until uv.lock is created on a contributor machine, this step also resolves it.
      # After committing uv.lock, change to `uv sync --locked` for strict CI reproducibility.
      - name: Install dependencies
        run: uv sync
      - name: Run tests (no raw data needed)
        run: uv run pytest -q
