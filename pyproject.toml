[project]
name = "etai-final-project-2627"
version = "0.1.0"
description = "ETAI 2026/27 - Everything & Then Some (classification and regression)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "PyYAML==6.0.3",
    "scikit-learn==1.8.0",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
